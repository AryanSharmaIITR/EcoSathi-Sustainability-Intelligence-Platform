[project]
name = "ecosathi-backend"
version = "0.1.0"
description = "EcoSathi Sustainability Intelligence Platform — backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "groq>=0.11",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# B008: Depends()/File()/Header() in argument defaults is required FastAPI style, not a bug.
ignore = ["B008"]
